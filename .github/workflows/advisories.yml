name: Advisories

# Security advisories against Cargo.lock. Runs daily and on main, never on
# pull requests. A failure here needs a fix or an ignore in deny.toml;
# GitHub emails the workflow's last editor when a scheduled run fails.
on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths: [Cargo.lock, deny.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  advisories:
    name: cargo deny (advisories)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
      - run: .github/scripts/deny-report.sh advisories
